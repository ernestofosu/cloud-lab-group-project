<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Reader | GT Library</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    
    <link href="style.css" rel="stylesheet">
<script>(function(){var t=localStorage.getItem('athenaeum-theme');if(t)document.documentElement.setAttribute('data-bs-theme',t);})()</script>
</head>
<body>
<div class="reader-floating-bar">
  <button class="theme-toggle-btn" type="button" title="Toggle dark mode">
    <i class="theme-toggle-icon bi bi-moon-stars-fill"></i>
  </button>
</div>
<div class="container-fluid py-3 h-100 d-flex flex-column reader-page-shell">
        <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom border-secondary">
            <h4 class="mb-0 text-white text-truncate pe-3" id="reader-title">Loading Document...</h4>
            <div class="d-flex gap-2">
                <a href="javascript:history.back()" class="btn btn-light btn-sm fw-medium"><i class="bi bi-x-lg me-1"></i> Close Reader</a>
            </div>
        </div>
        <div class="flex-grow-1 bg-secondary rounded shadow-lg overflow-hidden position-relative reader-content-shell" id="reader-container">
            <iframe id="pdf-frame" class="w-100 h-100 border-0 position-relative z-index-1 reader-frame-shell" src=""></iframe>
        </div>
    </div>
    <script src="config.js"></script>
<script src="main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const bookId = new URLSearchParams(window.location.search).get('id');
            if(!bookId) return;

            try {
                const data = await window.api.get(`/api/books/${bookId}`);
                document.getElementById('reader-title').textContent = data.title;
                if(data.file_path) {
                    const file = await window.api.get(`/api/books/${bookId}/file`);
                    document.getElementById('pdf-frame').src = file.fileUrl;
                } else {
                    document.getElementById('reader-container').innerHTML = '<div class="p-5 text-center text-white">Access Denied</div>';
                }
            } catch (error) {
                document.getElementById('reader-title').textContent = "Document Not Found";
            }
        });
    </script>
</body>
</html>
